<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Matrimony Connect</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fdf3f6;
            margin: 0;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 900px;
            margin: 0 auto 20px auto;
        }
        h2 {
            color: #7a1f3d;
            margin: 0;
        }
        .logout {
            text-decoration: none;
            background-color: #c2185b;
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
        }
        .filters {
            max-width: 900px;
            margin: 0 auto 20px auto;
            background: white;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: flex-end;
        }
        .filters div {
            display: flex;
            flex-direction: column;
        }
        .filters label {
            font-size: 13px;
            color: #555;
            margin-bottom: 4px;
        }
        .filters input, .filters select {
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .filters button {
            padding: 7px 16px;
            background-color: #7a1f3d;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            height: 33px;
        }
        #grid {
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
        }
        .profile-card {
            background: white;
            border-radius: 8px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .profile-card h3 {
            margin: 0 0 5px 0;
            color: #7a1f3d;
        }
        .profile-card p {
            margin: 3px 0;
            font-size: 14px;
            color: #555;
        }
        .empty {
            text-align: center;
            color: #888;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <header>
        <h2 id="welcomeMsg">Welcome!</h2>
        <a class="logout" href="/logout">Logout</a>
    </header>

    <div class="filters">
        <div>
            <label>Gender</label>
            <select id="filterGender">
                <option value="">Any</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>
        </div>
        <div>
            <label>Religion</label>
            <input type="text" id="filterReligion" placeholder="e.g. Hindu">
        </div>
        <div>
            <label>City</label>
            <input type="text" id="filterCity" placeholder="e.g. Chennai">
        </div>
        <button onclick="loadProfiles()">Search</button>
    </div>

    <div id="grid"></div>
    <p class="empty" id="emptyMsg" style="display:none;">No profiles found.</p>

    <script>
        const params = new URLSearchParams(window.location.search);
        const currentUser = params.get('user') || '';
        document.getElementById('welcomeMsg').textContent = currentUser
            ? `Welcome, ${currentUser}!`
            : 'Welcome!';

        async function loadProfiles() {
            const gender = document.getElementById('filterGender').value;
            const religion = document.getElementById('filterReligion').value;
            const city = document.getElementById('filterCity').value;

            const query = new URLSearchParams({
                exclude: currentUser,
                gender: gender,
                religion: religion,
                city: city
            });

            const grid = document.getElementById('grid');
            const emptyMsg = document.getElementById('emptyMsg');
            grid.innerHTML = '';

            try {
                const res = await fetch('/api/profiles?' + query.toString());
                const profiles = await res.json();

                if (!profiles.length) {
                    emptyMsg.style.display = 'block';
                    return;
                }
                emptyMsg.style.display = 'none';

                profiles.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'profile-card';
                    card.innerHTML = `
                        <h3>${p.fullName || p.username}</h3>
                        <p>${p.age ? p.age + ' yrs' : ''} ${p.gender ? '&middot; ' + p.gender : ''}</p>
                        <p>${p.religion || ''} ${p.caste ? '&middot; ' + p.caste : ''}</p>
                        <p>${p.education || ''}</p>
                        <p>${p.occupation || ''}</p>
                        <p>${p.city || ''} ${p.state ? ', ' + p.state : ''}</p>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                emptyMsg.textContent = 'Could not load profiles.';
                emptyMsg.style.display = 'block';
            }
        }

        loadProfiles();
    </script>
</body>
</html>
