<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Matrimony Connect</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fdf3f6;
            display: flex;
            justify-content: center;
            margin: 40px 0;
        }
        .card {
            background: white;
            padding: 30px 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            width: 420px;
        }
        h2 {
            color: #7a1f3d;
            text-align: center;
        }
        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 4px;
            color: #333;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: inherit;
        }
        input[type="submit"] {
            margin-top: 20px;
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }
        input[type="submit"]:hover {
            background-color: #1e7e34;
        }
        .error {
            color: #c2185b;
            text-align: center;
        }
        .back {
            display: block;
            margin-top: 15px;
            text-align: center;
        }
        .row {
            display: flex;
            gap: 10px;
        }
        .row > div {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Create Your Profile</h2>
        <p class="error" id="errorMsg" style="display:none;">That username is already taken.</p>
        <form action="/signup" method="post">
            <label>Username:</label>
            <input type="text" name="username" required>

            <label>Password:</label>
            <input type="password" name="password" required>

            <label>Full Name:</label>
            <input type="text" name="fullName" required>

            <div class="row">
                <div>
                    <label>Gender:</label>
                    <select name="gender" required>
                        <option value="">Select</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>
                <div>
                    <label>Age:</label>
                    <input type="number" name="age" min="18" max="100" required>
                </div>
            </div>

            <label>Marital Status:</label>
            <select name="maritalStatus" required>
                <option value="">Select</option>
                <option value="Never Married">Never Married</option>
                <option value="Divorced">Divorced</option>
                <option value="Widowed">Widowed</option>
            </select>

            <div class="row">
                <div>
                    <label>Religion:</label>
                    <input type="text" name="religion">
                </div>
                <div>
                    <label>Caste:</label>
                    <input type="text" name="caste">
                </div>
            </div>

            <label>Education:</label>
            <input type="text" name="education">

            <label>Occupation:</label>
            <input type="text" name="occupation">

            <div class="row">
                <div>
                    <label>City:</label>
                    <input type="text" name="city">
                </div>
                <div>
                    <label>State:</label>
                    <input type="text" name="state">
                </div>
            </div>

            <label>Contact Number:</label>
            <input type="text" name="contactNumber">

            <label>About Me:</label>
            <textarea name="about" rows="4"></textarea>

            <input type="submit" value="Create Profile">
        </form>
        <a class="back" href="/index.html">&larr; Back to home</a>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        if (params.get('error')) {
            document.getElementById('errorMsg').style.display = 'block';
        }
    </script>
</body>
</html>
