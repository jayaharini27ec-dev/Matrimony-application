<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Matrimony Connect</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fdf3f6;
            display: flex;
            justify-content: center;
            margin-top: 80px;
        }
        .card {
            background: white;
            padding: 30px 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            width: 320px;
        }
        h2 {
            color: #7a1f3d;
            text-align: center;
        }
        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 4px;
            color: #333;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        input[type="submit"] {
            margin-top: 20px;
            background-color: #c2185b;
            color: white;
            border: none;
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #99123f;
        }
        .error {
            color: #c2185b;
            text-align: center;
        }
        .back {
            display: block;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Sign In</h2>
        <p class="error" id="errorMsg" style="display:none;">Invalid username or password.</p>
        <form action="/signin" method="post">
            <label>Username:</label>
            <input type="text" name="username" required>

            <label>Password:</label>
            <input type="password" name="password" required>

            <input type="submit" value="Sign In">
        </form>
        <a class="back" href="/index.html">&larr; Back to home</a>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        if (params.get('error')) {
            document.getElementById('errorMsg').style.display = 'block';
        }
    </script>
</body>
</html>
